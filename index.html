<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>海边日落</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #1a0f24; }
  canvas { display: block; touch-action: none; }
  #veil { position: fixed; inset: 0; background: #1a0f24; pointer-events: none; transition: opacity 2.5s ease; }
  #ui { position: fixed; right: 20px; bottom: 20px; display: flex; gap: 10px; flex-wrap: wrap; justify-content: flex-end; }
  #ui button {
    padding: 10px 20px;
    font: 14px/1 "Microsoft YaHei", "PingFang SC", sans-serif; letter-spacing: 2px;
    color: #fff; background: rgba(255,255,255,.12); border: 1px solid rgba(255,255,255,.35);
    border-radius: 999px; backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px);
    cursor: pointer; transition: background .3s;
  }
  #ui button:hover { background: rgba(255,255,255,.25); }
  #hint {
    position: fixed; left: 20px; top: 20px; color: rgba(255,255,255,.6);
    font: 12px/1 "Microsoft YaHei", "PingFang SC", sans-serif; letter-spacing: 1px; pointer-events: none;
  }
</style>
<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
} }
</script>
</head>
<body>
<div id="veil"></div>
<div id="hint">拖动环视 · 滚轮前后移动</div>
<div id="ui">
  <button id="viewBtn">视角 · 自由</button>
  <button id="timeBtn">时间 · 日落</button>
</div>

<script type="module">
import * as THREE from 'three';
import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
import { OutputPass } from 'three/addons/postprocessing/OutputPass.js';

/* ---------- 基础 ---------- */
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 0.95;
document.body.prepend(renderer.domElement);

const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(55, innerWidth / innerHeight, 0.1, 3000);
camera.rotation.order = 'YXZ';

/* ---------- 地形函数（与着色器里的写法一致） ---------- */
const clamp = (x, a, b) => Math.min(Math.max(x, a), b);
const smooth = (a, b, x) => { const t = clamp((x - a) / (b - a), 0, 1); return t * t * (3 - 2 * t); };
const shoreZ = x => 2 + Math.sin(x * 0.05) * 1.5 + Math.sin(x * 0.013 + 1.7) * 2;
const roadX = z => 25 + 45 * Math.sin((z - 40) * 0.0118) * smooth(40, 120, z) + 80 * smooth(500, 1060, z);
const roadProfile = z => 50 * smooth(40, 520, z) - 40 * smooth(560, 1000, z);
const beachH = (x, z) => 0.9 * (1 - Math.exp(-Math.max(z - shoreZ(x), -60) * 0.08));
const roadH = (x, z) => beachH(x, z) + (z - shoreZ(x) > 40 ? roadProfile(z) : 0);

/* ---------- 三个时段的色调 ---------- */
const c = (r, g, b) => new THREE.Color(r, g, b);
const PAL = {
  day:    { horizon: c(0.50, 0.68, 0.90), mid: c(0.22, 0.45, 0.85), top: c(0.06, 0.20, 0.62),
            sun: c(0.50, 0.45, 0.33), water: c(0.01, 0.10, 0.20), elev: 0.75, bloom: 0.2, exp: 0.72, motes: 0.06 },
  sunset: { horizon: c(1.0, 0.44, 0.15), mid: c(0.85, 0.34, 0.44), top: c(0.15, 0.13, 0.40),
            sun: c(1.0, 0.62, 0.26), water: c(0.05, 0.07, 0.14), elev: 0.085, bloom: 0.5, exp: 0.95, motes: 0.6 },
  dusk:   { horizon: c(0.72, 0.28, 0.34), mid: c(0.27, 0.16, 0.42), top: c(0.02, 0.03, 0.12),
            sun: c(0.85, 0.36, 0.34), water: c(0.02, 0.03, 0.08), elev: -0.025, bloom: 0.45, exp: 0.95, motes: 0.35 },
};

const U = {
  uTime: { value: 0 }, uMix: { value: 0 }, uDay: { value: 0 }, uWalkFade: { value: 1 },
  uWalk: { value: Array.from({ length: 8 }, () => new THREE.Vector4()) },   // 行人位置（投影子用）
  uCar: { value: Array.from({ length: 5 }, () => new THREE.Vector4(0, -999, 0, 1)) },   // 车的位置与朝向
  uHorizon: { value: PAL.sunset.horizon.clone() }, uMid: { value: PAL.sunset.mid.clone() },
  uTop: { value: PAL.sunset.top.clone() }, uSunCol: { value: PAL.sunset.sun.clone() },
  uWater: { value: PAL.sunset.water.clone() },
  uSunDir: { value: new THREE.Vector3(0, PAL.sunset.elev, -1).normalize() },
};

/* ---------- 共用 GLSL ---------- */
const COMMON = /* glsl */`
  uniform float uTime, uMix, uDay;
  uniform vec3 uHorizon, uMid, uTop, uSunCol, uWater, uSunDir;

  float hash(vec2 p){ p = fract(p * vec2(123.34, 456.21)); p += dot(p, p + 45.32); return fract(p.x * p.y); }
  float noise(vec2 p){
    vec2 i = floor(p), f = fract(p); f = f * f * (3.0 - 2.0 * f);
    return mix(mix(hash(i), hash(i + vec2(1,0)), f.x), mix(hash(i + vec2(0,1)), hash(i + vec2(1,1)), f.x), f.y);
  }
  float fbm(vec2 p){ float a = 0.5, s = 0.0; for(int i = 0; i < 4; i++){ s += a * noise(p); p = p * 2.03 + 7.1; a *= 0.5; } return s; }

  vec3 skyColor(vec3 d){
    float h = max(d.y, 0.0);
    // 背向太阳一侧的地平线偏粉紫
    float az = dot(normalize(d.xz + 1e-5), normalize(uSunDir.xz)) * 0.5 + 0.5;
    vec3 hz = mix(mix(mix(uMid, uTop, 0.3), uHorizon, smoothstep(0.0, 1.0, az)), uHorizon, uDay);
    vec3 col = mix(hz, uMid, smoothstep(0.0, 0.25, h));
    col = mix(col, uTop, smoothstep(0.12, 0.75, h));
    float sd = max(dot(d, uSunDir), 0.0);
    col += uSunCol * (pow(sd, 8.0) * 0.24 + pow(sd, 64.0) * 0.42 + pow(sd, 600.0) * 0.8);
    return col;
  }
  // 沙漠公路：中心线与纵向起伏（爬上沙丘垭口，再下到城市）
  float roadX(float z){
    return 25.0 + 45.0 * sin((z - 40.0) * 0.0118) * smoothstep(40.0, 120.0, z) + 80.0 * smoothstep(500.0, 1060.0, z);
  }
  float roadProfile(float z){ return 50.0 * smoothstep(40.0, 520.0, z) - 40.0 * smoothstep(560.0, 1000.0, z); }
  // 沙滩高度：z 越大越靠近岸上
  float sandH(vec2 p){
    float shore = 2.0 + sin(p.x * 0.05) * 1.5 + sin(p.x * 0.013 + 1.7) * 2.0;
    float s = p.y - shore;
    float h = 0.9 * (1.0 - exp(-max(s, -60.0) * 0.08));
    if (s > 40.0) {   // 内陆：沙丘
      float ramp = smoothstep(40.0, 420.0, s) * (1.0 - 0.85 * smoothstep(750.0, 1100.0, s));
      vec2 q = p * vec2(0.0045, 0.008);
      float r = 1.0 - abs(2.0 * noise(q) - 1.0);
      float dn = (r * r * 52.0 + noise(q * 3.1 + 4.0) * 16.0 + noise(q * 9.0) * 3.0) * ramp;
      float cw = 1.0 - smoothstep(20.0, 100.0, abs(p.x - roadX(p.y)));   // 公路两侧 20 米内整平
      h += mix(dn, roadProfile(p.y), cw);
    }
    return h;
  }
  vec3 applyFogK(vec3 col, vec3 V, float dist, float k){
    vec3 fc = skyColor(normalize(vec3(-V.x, 0.02, -V.z)));
    return mix(col, fc, 1.0 - exp(-dist * k));
  }
  vec3 applyFog(vec3 col, vec3 V, float dist){ return applyFogK(col, V, dist, 0.0022 * (1.0 - 0.5 * uDay)); }
`;

/* ---------- 天空 ---------- */
const sky = new THREE.Mesh(
  new THREE.SphereGeometry(1200, 48, 24),
  new THREE.ShaderMaterial({
    uniforms: U, side: THREE.BackSide, depthWrite: false,
    vertexShader: `varying vec3 vDir; void main(){ vDir = position; gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0); }`,
    fragmentShader: COMMON + /* glsl */`
      varying vec3 vDir;
      void main(){
        vec3 d = normalize(vDir);
        vec3 col = skyColor(d);
        float sd = max(dot(d, uSunDir), 0.0);
        // 丝状云
        vec2 cp = d.xz / (abs(d.y) + 0.12) * vec2(0.6, 1.7) + vec2(uTime * 0.004, 0.0);
        float cm = smoothstep(0.45, 0.8, fbm(cp * 1.3)) * smoothstep(0.015, 0.14, d.y) * 0.75;
        vec3 cc = mix(uTop * 0.6 + uMid * 0.3, uSunCol * 1.3 + uHorizon * 0.4, pow(sd, 3.0) * 0.9 + 0.08);
        cc = mix(cc, vec3(1.0, 0.99, 0.97), uDay * 0.85);
        col = mix(col, cc, cm);
        // 星星（黄昏）
        vec3 g = floor(d * 380.0);
        float st = step(0.9982, hash(g.xy + g.z * 17.3));
        col += st * uMix * smoothstep(0.12, 0.5, d.y) * (1.0 - cm) * vec3(0.9, 0.92, 1.0);
        // 太阳圆盘
        col += uSunCol * smoothstep(0.99955, 0.9998, sd) * 6.0 * (1.0 - cm * 0.7);
        gl_FragColor = vec4(col, 1.0);
      }`,
  })
);
sky.renderOrder = -10;
sky.frustumCulled = false;
scene.add(sky);

const WORLD_VERT = /* glsl */`
  varying vec3 vWorld;
  void main(){ vec4 w = modelMatrix * vec4(position, 1.0); vWorld = w.xyz; gl_Position = projectionMatrix * viewMatrix * w; }
`;

/* ---------- 沙滩 ---------- */
const sand = new THREE.Mesh(
  new THREE.PlaneGeometry(1, 1, 360, 300),
  new THREE.ShaderMaterial({
    uniforms: U, side: THREE.DoubleSide,
    vertexShader: COMMON + /* glsl */`
      varying vec3 vWorld;
      void main(){
        float v = position.y + 0.5;
        float u = position.x * 2.0;
        float x = 1800.0 * u * (0.15 + 0.85 * abs(u));   // 中间网格更密
        float z = -10.0 + 1650.0 * v * v;                // 近处网格更密
        vWorld = vec3(x, sandH(vec2(x, z)), z);
        gl_Position = projectionMatrix * viewMatrix * vec4(vWorld, 1.0);
      }`,
    fragmentShader: COMMON + /* glsl */`
      varying vec3 vWorld;
      uniform vec4 uWalk[8];
      uniform vec4 uCar[5];
      uniform float uWalkFade;
      // 行人在沙滩上拉长的影子
      float walkShadow(vec2 p){
        float sh = 0.0;
        vec2 dir = -uSunDir.xz / max(uSunDir.y, 0.02);
        for (int i = 0; i < 8; i++) {
          vec4 w = uWalk[i];
          vec2 d = dir * w.z;
          float len = max(length(d), 1e-3);
          d *= min(len, 24.0) / len;
          vec2 pa = p - w.xy;
          float t = clamp(dot(pa, d) / max(dot(d, d), 1e-6), 0.0, 1.0);
          float dd = length(pa - d * t);
          sh = max(sh, (1.0 - smoothstep(w.w * 0.5, w.w * 1.3 + t * 0.6, dd)) * (1.0 - t * 0.7) * step(0.01, w.z));
        }
        return sh * smoothstep(0.01, 0.05, uSunDir.y) * uWalkFade;
      }
      // 沙面细微起伏：每一层细节在小于一个像素时自动淡出，远处不会出现条纹
      float bump(vec2 p, float fp){
        float s = 0.0, a = 0.5, f = 1.5;
        for (int i = 0; i < 5; i++) {
          s += a * noise(p * f + float(i) * 3.7) * clamp(1.0 - fp * f * 0.5, 0.0, 1.0);
          f *= 2.2; a *= 0.6;
        }
        return s;
      }
      void main(){
        vec3 toCam = cameraPosition - vWorld;
        float dist = length(toCam);
        vec3 V = toCam / dist;
        vec2 p = vWorld.xz;
        float fp = max(fwidth(p.x), fwidth(p.y));
        // 地形法线（沙丘明暗）
        float e = 0.6 + dist * 0.01;
        float h0 = sandH(p);
        vec3 N = normalize(vec3(h0 - sandH(p + vec2(e, 0.0)), e, h0 - sandH(p + vec2(0.0, e))));
        float wetY = vWorld.y + (noise(p * 0.5) - 0.5) * 0.1;
        float wet = smoothstep(0.32, 0.03, wetY);
        // 细微起伏的坡度
        float be = 0.03;
        float b0 = bump(p, fp);
        vec2 bg = vec2(bump(p + vec2(be, 0.0), fp) - b0, bump(p + vec2(0.0, be), fp) - b0) / be;
        // 风成沙纹：细密、扭曲、成片出现
        vec2 q = p + vec2(fbm(p * 0.15), fbm(p * 0.15 + 5.0)) * 3.0;
        float ph = q.y * 16.0 + sin(q.x * 1.3) * 1.5;
        float patchy = smoothstep(0.4, 0.75, noise(p * 0.08 + 9.0));
        float rip = cos(ph) * clamp(1.0 - fwidth(ph) * 0.4, 0.0, 1.0) * patchy;
        // 公路：直接画在地形上，边缘被沙子侵蚀
        float rz = p.y;
        float rm = (roadX(rz + 1.0) - roadX(rz - 1.0)) * 0.5;
        float dr = abs(p.x - roadX(rz)) / sqrt(1.0 + rm * rm);
        float edge = 4.2 + (noise(p * 0.3) - 0.5) * 1.2;
        float sdR = max(dr - edge, max(58.0 - rz, rz - 1302.0));
        sdR = min(sdR, length(p - vec2(roadX(60.0), 54.3)) - 4.8 - edge);        // 海边回车场
        sdR = min(sdR, length(p - vec2(roadX(1300.0), 1305.7)) - 9.0);           // 城市另一端
        float aa = fwidth(sdR) + 0.001;
        float road = 1.0 - smoothstep(-aa, aa, sdR);
        float dryK = (1.0 - wet * 0.85) * (1.0 - road);
        N = normalize(N + vec3(-bg.x * 0.05, 0.0, -bg.y * 0.05 - rip * 0.05) * dryK);
        float nl = max(dot(N, uSunDir), 0.0);
        // 色差：大尺度斑驳 + 凹处略深
        vec3 alb = mix(vec3(0.80, 0.64, 0.46), vec3(0.70, 0.50, 0.36), fbm(p * 0.03))
                 * (0.93 + (fbm(p * 0.4) - 0.5) * 0.16 + (b0 - 0.5) * 0.25);
        if (road > 0.001) {
          vec3 asph = vec3(0.075, 0.075, 0.085) * (0.8 + 0.4 * noise(p * 1.3));
          float inStrip = step(62.0, rz) * step(rz, 1298.0);
          float lw = clamp(0.25 / aa, 0.0, 1.0);
          float cl = (1.0 - smoothstep(0.11, 0.11 + aa, dr)) * step(0.5, fract(rz / 12.0));
          float el = 1.0 - smoothstep(0.07, 0.07 + aa, abs(dr - 3.5));
          asph = mix(asph, vec3(0.75, 0.62, 0.25), cl * lw * inStrip);
          asph = mix(asph, vec3(0.7), el * lw * 0.8 * inStrip);
          asph = mix(asph, alb * 0.75, smoothstep(0.55, 0.85, fbm(p * 0.07 + 3.0)) * 0.55);   // 路面浮沙
          alb = mix(alb, asph, road);
        }
        // 影子：行人（长影）与汽车（车底）
        float ws = p.y < 45.0 ? walkShadow(p) : 0.0;
        float cs = 0.0;
        if (road > 0.001) for (int i = 0; i < 5; i++) cs = max(cs, 1.0 - smoothstep(1.3, 3.6, length(p - uCar[i].xy)));
        vec3 amb = (uMid * 0.30 + uTop * 0.25 + uHorizon * 0.30) * (1.0 - 0.1 * ws - 0.35 * cs);
        vec3 dry = alb * (amb + uSunCol * nl * 3.2 * (1.0 - 0.85 * max(ws, cs)));
        if (uDay < 0.99 && p.y > 40.0) {                      // 车灯在路面上的光斑
          float hl = 0.0;
          for (int i = 0; i < 5; i++) {
            vec2 rv = p - uCar[i].xy, dv = uCar[i].zw;
            float along = dot(rv, dv), side = dot(rv, vec2(-dv.y, dv.x));
            float al = max(along, 0.0);
            hl += smoothstep(1.5, 5.0, along) * exp(-al * 0.045) * exp(-side * side / (4.0 + al * 0.9));
          }
          dry += alb * vec3(1.0, 0.88, 0.65) * hl * 2.2 * (1.0 - uDay) * (0.12 + 0.88 * uMix);
        }
        // 湿沙倒映天空
        vec3 R = reflect(-V, normalize(N + vec3(0.0, 2.0, 0.0)));
        R.y = abs(R.y);
        float F = 0.10 + 0.90 * pow(1.0 - max(V.y, 0.0), 3.0);
        vec3 wetCol = dry * 0.42 + skyColor(R) * F * 0.75;
        vec3 col = mix(dry, wetCol, wet);
        gl_FragColor = vec4(applyFog(col, V, dist), 1.0);
      }`,
  })
);
sand.frustumCulled = false;
scene.add(sand);

/* ---------- 海面 ---------- */
const water = new THREE.Mesh(
  new THREE.PlaneGeometry(3000, 3000),
  new THREE.ShaderMaterial({
    uniforms: U, transparent: true, depthWrite: false,
    vertexShader: WORLD_VERT,
    fragmentShader: COMMON + /* glsl */`
      varying vec3 vWorld;
      float wh(vec2 p, float far){
        float t = uTime;
        return noise(p * 0.35 + vec2(t * 0.25, t * 0.18)) * 0.6
             + noise(p * 0.9 + vec2(-t * 0.30, t * 0.22)) * 0.3 * far
             + noise(p * 2.3 + vec2(t * 0.50, -t * 0.40)) * 0.12 * far * far;
      }
      void main(){
        vec3 toCam = cameraPosition - vWorld;
        float dist = length(toCam);
        vec3 V = toCam / dist;
        vec2 p = vWorld.xz;
        float far = 1.0 - smoothstep(20.0, 400.0, dist) * 0.8;
        float e = 0.15;
        float dx = (wh(p + vec2(e, 0.0), far) - wh(p - vec2(e, 0.0), far)) / (2.0 * e);
        float dz = (wh(p + vec2(0.0, e), far) - wh(p - vec2(0.0, e), far)) / (2.0 * e);
        vec3 N = normalize(vec3(-dx * 0.5, 1.0, -dz * 0.5));
        vec3 R = reflect(-V, N); R.y = abs(R.y);
        float F = 0.02 + 0.98 * pow(1.0 - max(dot(N, V), 0.0), 5.0);
        float depth = vWorld.y - sandH(p);
        vec3 shallow = mix(uWater * 1.5, vec3(0.08, 0.42, 0.45), uDay);          // 白天近岸偏青绿
        vec3 col = mix(mix(shallow, uWater, smoothstep(0.0, 1.5, depth)), skyColor(R), F);
        col += uSunCol * pow(max(dot(R, uSunDir), 0.0), 500.0) * 5.0;
        // 岸边浪花
        float fn = noise(p * 3.0 + uTime * 0.3);
        float foam = smoothstep(0.11, 0.015, depth) * (0.55 + 0.45 * fn);
        foam += smoothstep(0.05, 0.0, abs(depth - 0.2 - 0.05 * sin(uTime * 0.5))) * fn * 0.35;
        col = mix(col, uHorizon * 0.5 + vec3(0.85, 0.8, 0.85), clamp(foam, 0.0, 1.0) * 0.8);
        float alpha = smoothstep(0.0, 0.035, depth);
        gl_FragColor = vec4(applyFog(col, V, dist), alpha);
      }`,
  })
);
water.rotation.x = -Math.PI / 2;
water.frustumCulled = false;
water.renderOrder = 1;
scene.add(water);

/* ---------- 远方城市 ---------- */
// 固定随机种子：每次打开都是同一条天际线
let seed = 20261113;
const rnd = () => { seed = seed + 0x6D2B79F5 | 0; let t = Math.imul(seed ^ seed >>> 15, 1 | seed); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; };
const parts = [];
for (let row = 0; row < 3; row++) {
  for (let x = -480; x <= 480; x += 30) {          // 按网格排布，楼与楼之间留空隙
    if (rnd() < 0.28) continue;
    const dx = x + (rnd() - 0.5) * 12 + row * 10;
    const h = 95 + rnd() * 90
            + 360 * Math.exp(-(((dx + 60) / 130) ** 2)) * (0.3 + 0.7 * rnd())    // 主城区
            + 230 * Math.exp(-(((dx - 270) / 80) ** 2)) * (0.3 + 0.7 * rnd());   // 副中心
    const w = 13 + rnd() * 9, d = 13 + rnd() * 9;
    const b = { x: 120 + dx, z: 1080 + row * 70 + (rnd() - 0.5) * 20, rot: (rnd() - 0.5) * 1.2,
                tone: 0.7 + rnd() * 0.6, haze: row * 0.12, glint: rnd() < 0.22 ? 1 : 0, sd: rnd() * 0.9 };
    if (Math.abs(b.x - roadX(b.z)) < 22) continue;   // 给公路让出一条街
    if (h > 170 && rnd() < 0.45) {                 // 退台式高楼
      parts.push({ ...b, y: -10, w, h: h * 0.62 + 10, d });
      parts.push({ ...b, y: -10, w: w * 0.66, h: h + 10, d: d * 0.66 });
      if (h > 340) parts.push({ ...b, y: h, w: 1.8, h: 55, d: 1.8 });   // 尖顶
    } else parts.push({ ...b, y: -10, w, h: h + 10, d });
  }
}
const boxGeo = new THREE.BoxGeometry(1, 1, 1); boxGeo.translate(0, 0.5, 0);
const city = new THREE.InstancedMesh(boxGeo, new THREE.ShaderMaterial({
  uniforms: U,
  vertexShader: /* glsl */`
    varying vec3 vWorld, vN, vInst; varying float vFace, vTop, vY;
    void main(){

const walkFade = { value: 1 }, ONE = { value: 1 };
const matCache = new Map();

  if (!matCache.has(key)) matCache.set(key, new THREE.ShaderMaterial({
    uniforms: { ...U, uColor: { value: new THREE.Color(color) }, uFade: fade, uGlow: { value: glow } },
    transparent: fade !== ONE,
    vertexShader: /* glsl */`
      varying vec3 vWorld, vN;
      void main(){
        vec4 w = modelMatrix * vec4(position, 1.0);

    fragmentShader: COMMON + /* glsl */`
      uniform vec3 uColor; uniform float uFade, uGlow;
      varying vec3 vWorld, vN;
      void main(){
        vec3 toCam = cameraPosition - vWorld;
        float dist = length(toCam);
        vec3 V = toCam / dist;
        vec3 N = normalize(vN);
        float sunUp = smoothstep(-0.02, 0.06, uSunDir.y);
        vec3 amb = (uMid * 0.30 + uTop * 0.25 + uHorizon * 0.30) * (0.75 + 0.25 * N.y);
        float rim = pow(1.0 - max(dot(N, V), 0.0), 3.0) * max(dot(-V, uSunDir), 0.0);   // 逆光时的金边
        vec3 col = uColor * (amb + uSunCol * max(dot(N, uSunDir), 0.0) * 2.2 * sunUp) + uSunCol * rim * 0.9 * sunUp;
        col += uColor * uGlow * (1.0 - uDay);                                             // 车灯：日落后点亮
        gl_FragColor = vec4(applyFog(col, V, dist), uFade);
      }`,
  }));

timeBtn.onclick = () => { timeMode = (timeMode + 1) % 3; timeBtn.textContent = '时间 · ' + TIME_NAMES[timeMode]; };

// 环视控制：水平 360°，俯仰接近正上 / 正下
const look = { yaw: 0, pitch: 0, tYaw: 0, tPitch: 0, fov: 55, tFov: 55 };
const freePos = new THREE.Vector3(0, 2.3, 17), freeTarget = freePos.clone();
let freeLook = { yaw: 0, pitch: 0 }, lastInput = -1e9;
const clampFree = p => {
  p.x = clamp(p.x, -70, 70); p.z = clamp(p.z, -60, 36);
  p.y = clamp(p.y, Math.max(beachH(p.x, p.z), 0.08) + 1.3, 40);
};
function zoomBy(d) {
  lastInput = performance.now();
  if (viewMode === 0) { freeTarget.addScaledVector(camera.getWorldDirection(v4), -d * 2.5); clampFree(freeTarget); }   // 自由视角：沿视线前后移动
  else look.tFov = clamp(look.tFov + d * 4, 25, 80);                                                                   // 行人 / 汽车：缩放
}
const canvas = renderer.domElement, pointers = new Map();
let pinch = 0;
canvas.addEventListener('pointerdown', e => {
  pointers.set(e.pointerId, [e.clientX, e.clientY]); pinch = 0;
  try { canvas.setPointerCapture(e.pointerId); } catch {}
});
canvas.addEventListener('pointermove', e => {
  const prev = pointers.get(e.pointerId);
  if (!prev) return;
  lastInput = performance.now();
  if (pointers.size === 1) {
    const k = 0.0032 * camera.fov / 55;
    look.tYaw += (e.clientX - prev[0]) * k;
    look.tPitch = clamp(look.tPitch + (e.clientY - prev[1]) * k, -1.5, 1.5);
  }
  pointers.set(e.pointerId, [e.clientX, e.clientY]);
  if (pointers.size === 2) {                                   // 双指捏合
    const [a, b] = [...pointers.values()], d = Math.hypot(a[0] - b[0], a[1] - b[1]);
    if (pinch) zoomBy((pinch - d) * 0.02);
    pinch = d;
  }
});
const release = e => { pointers.delete(e.pointerId); pinch = 0; };
canvas.addEventListener('pointerup', release);
canvas.addEventListener('pointercancel', release);
canvas.addEventListener('wheel', e => { e.preventDefault(); zoomBy(clamp(e.deltaY * 0.01, -3, 3)); }, { passive: false });

function applyView(v) {
  viewMode = v;
  viewBtn.textContent = '视角 · ' + VIEW_NAMES[v];
  hint.textContent = v === 0 ? '拖动环视 · 滚轮前后移动' : '拖动环视 · 滚轮缩放';
  owner.root.visible = v !== 1;                                  // 第一人称时不显示自己
  cars[0].userData.top.forEach(m => m.visible = v !== 2);
  if (v === 0) { look.tYaw = freeLook.yaw; look.tPitch = freeLook.pitch; look.tFov = 55; }
  if (v === 1) { look.tYaw = Math.atan2(-povGroup.dir, 1.7); look.tPitch = 0; look.tFov = 62; }   // 顺着走的方向、偏向大海
  if (v === 2) { look.tYaw = 0; look.tPitch = -0.03; look.tFov = 64; }
  look.yaw = look.tYaw; look.pitch = look.tPitch; look.fov = look.tFov;
}
viewBtn.onclick = () => {
  if (viewMode === 0) freeLook = { yaw: look.tYaw, pitch: look.tPitch };
  const next = (viewMode + 1) % 3;
  veil.style.transitionDuration = '.3s'; veil.style.opacity = 1;
  setTimeout(() => { applyView(next); veil.style.opacity = 0; }, 320);
};

addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight; camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight); composer.setSize(innerWidth, innerHeight);
});

/* ---------- 循环 ---------- */
const clock = new THREE.Clock();
const qLook = new THREE.Quaternion(), eLook = new THREE.Euler();
function frame() {
  const dt = Math.min(clock.getDelta(), 0.05), t = clock.elapsedTime;
  U.uTime.value = t;

  // 时段过渡：白天(0) → 日落(1) → 黄昏(2)
  tod += (timeMode - tod) * Math.min(dt * 1.2, 1);
  const i = tod < 1 ? 0 : 1, f = clamp(tod - i, 0, 1), A = MODES[i], B = MODES[i + 1], mixv = (a, b) => a + (b - a) * f;
  U.uHorizon.value.lerpColors(A.horizon, B.horizon, f);
  U.uMid.value.lerpColors(A.mid, B.mid, f);
  U.uTop.value.lerpColors(A.top, B.top, f);
  U.uSunCol.value.lerpColors(A.sun, B.sun, f);
  U.uWater.value.lerpColors(A.water, B.water, f);
  U.uSunDir.value.set(0, mixv(A.elev, B.elev), -1).normalize();
  U.uMix.value = Math.max(tod - 1, 0); U.uDay.value = Math.max(1 - tod, 0);
  bloom.strength = mixv(A.bloom, B.bloom);
  renderer.toneMappingExposure = mixv(A.exp, B.exp);
  motesMat.opacity = mixv(A.motes, B.motes);
  walkFade.value = U.uWalkFade.value = smooth(0.3, 0.8, tod);   // 行人在傍晚出现
  walkersRoot.visible = walkFade.value > 0.01;

  water.position.y = 0.06 * Math.sin(t * 0.5);          // 潮水涨落
  motes.position.y = Math.sin(t * 0.2) * 0.3;
  motes.rotation.y = Math.sin(t * 0.03) * 0.15;

  for (const g of gulls) {
    const d = g.userData;
    g.position.addScaledVector(d.v, dt);
    g.position.y = d.y0 + Math.sin(t * 0.4 + d.phase) * 0.6;
    if (Math.abs(g.position.x) > 110) { g.position.x = -Math.sign(d.v.x) * 110; g.position.z = d.z0; }
    const a = Math.sin(t * d.flap + d.phase) * 0.55 + 0.1;
    d.r.rotation.z = a; d.l.rotation.z = -a;
  }

  updateWalkers(dt, t, true);
  updateCars(dt);

  // 镜头
  if (viewMode === 0 && performance.now() - lastInput > 6000) look.tYaw += dt * 0.02;   // 闲置时缓慢环视
  const k = Math.min(dt * 10, 1);
  look.yaw += (look.tYaw - look.yaw) * k;
  look.pitch += (look.tPitch - look.pitch) * k;
  if (Math.abs(look.tFov - look.fov) > 0.01) { look.fov += (look.tFov - look.fov) * k; camera.fov = look.fov; camera.updateProjectionMatrix(); }
  if (viewMode === 2) {                                   // 汽车：跟随车头方向
    const car = cars[0];
    car.updateMatrixWorld();
    camera.position.copy(car.localToWorld(v3.set(0.36, 1.35, 1.2)));
    camera.quaternion.copy(car.quaternion).multiply(qLook.setFromEuler(eLook.set(look.pitch, look.yaw + Math.PI, 0, 'YXZ')));
  } else {
    if (viewMode === 1) {                                 // 行人：遛狗的人的眼睛
      owner.root.getWorldPosition(v3);
      camera.position.set(v3.x, v3.y + 1.62 + 0.02 * Math.abs(Math.sin(povGroup.phase)), v3.z);
    } else {
      freePos.lerp(freeTarget, Math.min(dt * 6, 1));
      camera.position.copy(freePos);
    }
    camera.rotation.set(look.pitch, look.yaw, 0, 'YXZ');
  }
  sky.position.copy(camera.position);

  composer.render();
  requestAnimationFrame(frame);
}
frame();
veil.style.opacity = 0;
</script>
</body>
</html>
